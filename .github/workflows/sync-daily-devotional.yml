name: Sync daily devotional

on:
  schedule:
    - cron: "20 5 * * *" # daily at 05:20 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync daily devotional from Apps Script
        env:
          WORD_OASIS_FORM_ENDPOINT: ${{ secrets.WORD_OASIS_FORM_ENDPOINT }}
        run: node scripts/sync-daily-devotional.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add -A
          git commit -m "Sync daily devotional feed"
          git push
